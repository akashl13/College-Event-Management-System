{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-panel site-reveal"><p class="eyebrow">JOIN EVENT CAMPUS</p><h1>Make campus yours.</h1><p>Create an account to discover events, save your place, and carry your digital pass with you.</p><form method="post"><label class="form-field">Full name<input class="input" name="full_name" required placeholder="Maya Chen"></label><label class="form-field">Student ID <span>(optional)</span><input class="input" name="student_id" placeholder="STU-1001"></label><label class="form-field">Email<input class="input" type="email" name="email" required placeholder="you@campus.edu"></label><label class="form-field">Password<input class="input" type="password" name="password" minlength="6" required placeholder="At least 6 characters"></label><button class="button" type="submit">Create account →</button></form><p>Already registered? <a class="section-link" href="{{ url_for('auth.login') }}">Sign in</a></p></div></div>{% endblock %}
