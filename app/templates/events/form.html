{% extends 'base.html' %}{% block title %}{{ 'Edit' if event else 'Create' }} event{% endblock %}{% block content %}<div class="page-wrap"><div class="site-reveal"><p class="eyebrow">ADMIN WORKSPACE</p><h1 class="page-title">{{ 'Edit event' if event else 'Create an event' }}</h1><p class="page-lede">Give your campus community the detail they need to decide quickly.</p></div><form method="post" class="form-surface form-grid site-reveal stagger-1"><label class="form-field full">Event name<input class="input" name="title" value="{{ event.title if event else '' }}" required></label><label class="form-field full">Description<textarea class="input" rows="5" name="description" required>{{ event.description if event else '' }}</textarea></label><label class="form-field">Category<select class="input" name="category">{% for category in ['Technical','Cultural','Sports','Workshop','Career','Seminar','Competition','Other'] %}<option {% if event and event.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></label><label class="form-field">Venue<input class="input" name="venue" value="{{ event.venue if event else '' }}" required></label><label class="form-field">Maximum participants<input class="input" type="number" name="max_participants" value="{{ event.max_participants if event else 100 }}" min="1" required></label><label class="form-field">Event date<input class="input" type="date" name="event_date" value="{{ event.event_date if event else '' }}" required></label><label class="form-field">Start time<input class="input" type="time" name="start_time" value="{{ event.start_time.strftime('%H:%M') if event else '17:00' }}" required></label><label class="form-field">End time<input class="input" type="time" name="end_time" value="{{ event.end_time.strftime('%H:%M') if event else '19:00' }}" required></label><label class="form-field">Registration deadline<input class="input" type="date" name="registration_deadline" value="{{ event.registration_deadline if event else '' }}" required></label><div class="form-actions full"><button class="button" type="submit">{{ 'Save changes' if event else 'Create event' }} →</button><a class="button button-secondary" href="{{ url_for('main.events') }}">Cancel</a></div></form></div>{% endblock %}
